---
- name: Check whether AWS CLI v2 is installed
  ansible.builtin.command:
    cmd: /usr/local/bin/aws --version
  register: aws_cli_check
  changed_when: false
  failed_when: false

- name: Install AWS CLI v2 when absent
  when: aws_cli_check.rc != 0
  block:
    - name: Install AWS CLI installer prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download the official AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        owner: root
        group: root
        mode: "0644"

    - name: Extract the AWS CLI installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws/install

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install
        creates: /usr/local/bin/aws

    - name: Remove AWS CLI installer files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws

- name: Install the Nginx log-backup script
  ansible.builtin.template:
    src: backup-nginx-logs.sh.j2
    dest: "{{ log_backup_script_path }}"
    owner: root
    group: root
    mode: "0750"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Install the systemd log-backup service
  ansible.builtin.template:
    src: nginx-log-backup.service.j2
    dest: "/etc/systemd/system/{{ log_backup_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Install the daily systemd log-backup timer
  ansible.builtin.template:
    src: nginx-log-backup.timer.j2
    dest: "/etc/systemd/system/{{ log_backup_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Apply systemd changes before verification
  ansible.builtin.meta: flush_handlers

- name: Verify access through the EC2 IAM role
  ansible.builtin.command:
    cmd: aws sts get-caller-identity --region {{ aws_region }}
  register: caller_identity
  changed_when: false
