---
- name: Install the AWS CLI for S3 log backups
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the Nginx log-backup script
  ansible.builtin.template:
    src: backup-nginx-logs.sh.j2
    dest: "{{ log_backup_script_path }}"
    owner: root
    group: root
    mode: "0750"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Install the systemd log-backup service
  ansible.builtin.template:
    src: nginx-log-backup.service.j2
    dest: "/etc/systemd/system/{{ log_backup_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Install the daily systemd log-backup timer
  ansible.builtin.template:
    src: nginx-log-backup.timer.j2
    dest: "/etc/systemd/system/{{ log_backup_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable and start the Nginx log-backup timer
    - Run the initial Nginx log backup

- name: Apply systemd changes before verification
  ansible.builtin.meta: flush_handlers

- name: Verify access through the EC2 IAM role
  ansible.builtin.command:
    cmd: aws sts get-caller-identity --region {{ aws_region }}
  register: caller_identity
  changed_when: false

