---
name: Validate infrastructure and configuration code

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Run TFLint
        working-directory: terraform
        run: tflint --init && tflint

  ansible:
    name: Ansible checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible tooling
        run: python -m pip install ansible ansible-lint

      - name: Check Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook.yml

      - name: Run Ansible lint
        run: ansible-lint ansible/
