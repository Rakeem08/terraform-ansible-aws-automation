<text x="80" y="983" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#3f5675" font-weight="700">DESIGN &amp; OPERATIONS</text>
<text x="80" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">01  CONFIGURE REPEATABLY</text>
<text x="80" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">Ansible roles install and configure Nginx.</text>
<text x="80" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">Inventory connects provisioning to setup.</text>
<text x="630" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">02  VERIFY THE RESULT</text>
<text x="630" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">Ansible requests http://127.0.0.1/.</text>
<text x="630" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">Checks HTTP 200 and Hello, World! text.</text>
<text x="1180" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">03  CHECK CODE QUALITY</text>
<text x="1180" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">GitHub Actions validates Terraform / Ansible.</text>
<text x="1180" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">AWS deployment is a manual operation.</text>
<text x="65" y="1175" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">BUILT WITH   Terraform • Ansible • EC2 • Nginx • IAM • S3 • systemd • GitHub Actions</text>
