<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">AWS Infrastructure &amp; Server Automation</title><desc id="desc">Terraform provisions a public EC2 web server, networking, IAM and private S3. Its output produces an Ansible inventory. Ansible configures Nginx over SSH restricted to an administrator CIDR, verifies HTTP locally, and optionally configures daily S3 log archives using the instance IAM role.</desc><defs>
